name: daily-video
on:
  schedule:
    - cron: "17 2 * * *"   # ~07:47 IST, off the hour so GitHub does not drop it
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic override"
        required: false
permissions:
  contents: write   # lets the job host the MP4 as a release asset for Threads
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - run: pip install -r requirements.txt
      - name: Make and upload today's Short (private unless AUTO_PUBLISH=true)
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
        run: python -m app.video.daily "${{ github.event.inputs.topic }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 14
